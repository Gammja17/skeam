ai_note: "코드와 기획은 Claude Code와 함께 만들었어요. 3D 모델은 Kenney·Quaternius의 CC0 에셋, 효과음은 BigSoundBank의 CC0 실제 녹음과 Kenney 효과음, 글꼴은 도현(OFL)을 썼어요. 온라인은 서버 없이 브라우저끼리 WebRTC로 연결해요."
